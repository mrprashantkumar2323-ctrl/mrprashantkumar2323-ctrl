<svg fill="none" viewBox="0 0 850 180" width="100%" height="180" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .banner-container {
          background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #030712 100%);
          border: 1px solid rgba(56, 189, 248, 0.25);
          border-radius: 16px;
          height: 178px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          position: relative;
          overflow: hidden;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .glow {
          position: absolute;
          width: 320px;
          height: 120px;
          background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(129, 140, 248, 0.15) 40%, transparent 70%);
          top: -20px;
          filter: blur(30px);
          pointer-events: none;
        }
        .title {
          font-size: 32px;
          font-weight: 800;
          letter-spacing: 2px;
          background: linear-gradient(90deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin-bottom: 8px;
          text-transform: uppercase;
        }
        .subtitle {
          color: #94a3b8;
          font-size: 15px;
          font-weight: 500;
          letter-spacing: 1px;
          display: flex;
          align-items: center;
          gap: 12px;
        }
        .badge {
          display: inline-block;
          padding: 3px 10px;
          border-radius: 20px;
          font-size: 11px;
          font-weight: 600;
          background: rgba(56, 189, 248, 0.1);
          color: #38bdf8;
          border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .dots {
          position: absolute;
          width: 100%;
          height: 100%;
          background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
          background-size: 16px 16px;
          opacity: 0.7;
          pointer-events: none;
        }
      </style>
      <div class="banner-container">
        <div class="dots"></div>
        <div class="glow"></div>
        <div class="title">PRASHANT KUMAR</div>
        <div class="subtitle">
          <span>Data Science &amp; Analytics</span>
          <span style="color:#475569">•</span>
          <span>Machine Learning</span>
          <span style="color:#475569">•</span>
          <span>GenAI &amp; Agentic Systems</span>
        </div>
        <div style="margin-top: 12px; display: flex; gap: 8px;">
          <span class="badge">🚀 B.Tech CSE (2023–2027)</span>
          <span class="badge" style="color: #a78bfa; border-color: rgba(167, 139, 250, 0.3); background: rgba(167, 139, 250, 0.1);">📊 Power BI &amp; Python</span>
          <span class="badge" style="color: #34d399; border-color: rgba(52, 211, 153, 0.3); background: rgba(52, 211, 153, 0.1);">🏆 5x Industry Simulations</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>