<svg fill="none" viewBox="0 0 850 330" width="100%" height="330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <style>
    .term-window {
      fill: #0a0e17;
      stroke: url(#termBorder);
      stroke-width: 1.5;
      rx: 12;
    }
    .term-header {
      fill: #111827;
      rx: 12;
    }
    .term-title {
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      fill: #94a3b8;
    }
    .code-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.7;
    }
    .prompt { fill: #38bdf8; font-weight: bold; }
    .cmd { fill: #f8fafc; font-weight: 600; }
    .output-green { fill: #34d399; }
    .output-purple { fill: #c084fc; }
    .output-blue { fill: #60a5fa; }
    .comment { fill: #64748b; font-style: italic; }
    .cursor {
      fill: #38bdf8;
    }
  </style>

  <!-- Terminal Body -->
  <rect x="2" y="2" width="846" height="326" class="term-window" />

  <!-- Terminal Header Bar -->
  <path d="M 2 14 Q 2 2 14 2 L 836 2 Q 848 2 848 14 L 848 38 L 2 38 Z" fill="#131b2e" />

  <!-- Window Dots -->
  <circle cx="24" cy="20" r="6" fill="#ef4444" />
  <circle cx="44" cy="20" r="6" fill="#f59e0b" />
  <circle cx="64" cy="20" r="6" fill="#10b981" />

  <!-- Window Title -->
  <text x="425" y="24" text-anchor="middle" class="term-title">prashant@workspace:~ (zsh) — python3</text>

  <!-- Terminal Code Content -->
  <g transform="translate(30, 70)" class="code-text">
    <text x="0" y="0">
      <tspan class="prompt">prashant@core:~$ </tspan>
      <tspan class="cmd">python -m prashant.analytics --simulate-all</tspan>
    </text>

    <text x="0" y="28">
      <tspan class="output-green">[OK] ✈️ Loading British Airways Booking Predictor... </tspan>
      <tspan class="output-blue">[RandomForest: 85.20% ACC | 0.77 AUC]</tspan>
    </text>

    <text x="0" y="56">
      <tspan class="output-green">[OK] 🤖 Initializing Tata Geldium AI Collections Engine... </tspan>
      <tspan class="output-purple">[Agentic Loop: ACTIVE]</tspan>
    </text>

    <text x="0" y="84">
      <tspan class="output-green">[OK] 📈 Computing JPMorgan Natural Gas Storage Valuation... </tspan>
      <tspan class="output-blue">[Optimal FICO Binning: CONVERGED]</tspan>
    </text>

    <text x="0" y="112">
      <tspan class="output-green">[OK] 📊 Connecting Power BI Executive Intelligence... </tspan>
      <tspan class="output-purple">[DAX Workforce Models: SYNCED]</tspan>
    </text>

    <text x="0" y="140">
      <tspan class="output-green">[OK] 🎬 Streaming Netflix Catalog EDA Insights... </tspan>
      <tspan class="output-blue">[Seaborn / Matplotlib Visuals: READY]</tspan>
    </text>

    <text x="0" y="176">
      <tspan class="comment"># Status: All systems operational. Open for AI &amp; Data Engineering roles.</tspan>
    </text>

    <text x="0" y="208">
      <tspan class="prompt">prashant@core:~$ </tspan>
      <tspan class="cmd">cat current_status.json | jq .objective</tspan>
    </text>

    <text x="0" y="234">
      <tspan class="output-purple">"Turning complex high-dimensional data into decisive business value."</tspan>
      <tspan class="cursor"> █
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
      </tspan>
    </text>
  </g>
</svg>