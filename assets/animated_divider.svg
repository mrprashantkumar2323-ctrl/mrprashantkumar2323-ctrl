<svg fill="none" viewBox="0 0 900 20" width="100%" height="20" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1">
        <animate attributeName="offset" values="0.1;0.9;0.1" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
    <filter id="laserGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <line x1="20" y1="10" x2="880" y2="10" stroke="#1e293b" stroke-width="1.5" />
  <line x1="20" y1="10" x2="880" y2="10" stroke="url(#laserBeam)" stroke-width="2.5" filter="url(#laserGlow)" />
  <circle cx="450" cy="10" r="3.5" fill="#38bdf8">
    <animate attributeName="cx" values="100;800;100" dur="4s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#38bdf8;#c084fc;#34d399;#38bdf8" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>