<svg fill="none" viewBox="0 0 900 230" width="100%" height="230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Animated Gradient for Border and Glow -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#34d399;#38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#34d399;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#818cf8;#c084fc;#34d399" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .banner-bg {
      fill: #070b14;
      stroke: url(#neonGradient);
      stroke-width: 2;
      rx: 18;
    }
    .grid-pattern {
      opacity: 0.12;
      stroke: #38bdf8;
      stroke-width: 0.8;
    }
    .hero-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 38px;
      letter-spacing: 4px;
      fill: #ffffff;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
    }
    .hero-sub {
      font-family: 'Fira Code', -apple-system, monospace;
      font-size: 14px;
      letter-spacing: 2px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #38bdf8;
    }
  </style>

  <!-- Background -->
  <rect x="2" y="2" width="896" height="226" class="banner-bg" />

  <!-- Animated Grid Lines -->
  <g class="grid-pattern">
    <line x1="50" y1="0" x2="50" y2="230" />
    <line x1="150" y1="0" x2="150" y2="230" />
    <line x1="250" y1="0" x2="250" y2="230" />
    <line x1="350" y1="0" x2="350" y2="230" />
    <line x1="450" y1="0" x2="450" y2="230" />
    <line x1="550" y1="0" x2="550" y2="230" />
    <line x1="650" y1="0" x2="650" y2="230" />
    <line x1="750" y1="0" x2="750" y2="230" />
    <line x1="850" y1="0" x2="850" y2="230" />

    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="90" x2="900" y2="90" />
    <line x1="0" y1="140" x2="900" y2="140" />
    <line x1="0" y1="190" x2="900" y2="190" />
  </g>

  <!-- Floating Glowing Particles -->
  <circle cx="120" cy="50" r="3" fill="#38bdf8" opacity="0.6">
    <animate attributeName="cy" values="50;40;50" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="780" cy="65" r="3.5" fill="#c084fc" opacity="0.7">
    <animate attributeName="cy" values="65;75;65" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="830" cy="160" r="2.5" fill="#34d399" opacity="0.5">
    <animate attributeName="cy" values="160;145;160" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="70" cy="170" r="3" fill="#818cf8" opacity="0.6">
    <animate attributeName="cy" values="170;185;170" dur="4.5s" repeatCount="indefinite" />
  </circle>

  <!-- Frequency Equalizer / Data Visualizer Bars -->
  <g transform="translate(380, 150)">
    <rect x="0" y="0" width="4" height="20" fill="#38bdf8" rx="2">
      <animate attributeName="height" values="8;24;6;20;8" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="16;0;18;4;16" dur="1.2s" repeatCount="indefinite" />
    </rect>
    <rect x="8" y="0" width="4" height="24" fill="#60a5fa" rx="2">
      <animate attributeName="height" values="20;8;26;12;20" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="4;16;-2;12;4" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <rect x="16" y="0" width="4" height="28" fill="#818cf8" rx="2">
      <animate attributeName="height" values="12;30;8;22;12" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="12;-6;16;2;12" dur="1.1s" repeatCount="indefinite" />
    </rect>
    <rect x="24" y="0" width="4" height="32" fill="#a78bfa" rx="2">
      <animate attributeName="height" values="28;14;34;18;28" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="-4;10;-10;6;-4" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <rect x="32" y="0" width="4" height="26" fill="#c084fc" rx="2">
      <animate attributeName="height" values="16;28;10;24;16" dur="1.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="8;-4;14;0;8" dur="1.3s" repeatCount="indefinite" />
    </rect>
    <rect x="40" y="0" width="4" height="22" fill="#34d399" rx="2">
      <animate attributeName="height" values="24;10;22;8;24" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="0;14;2;16;0" dur="1.6s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Glowing Laser Line Underneath -->
  <line x1="150" y1="125" x2="750" y2="125" stroke="url(#neonGradient)" stroke-width="2" opacity="0.85" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite" />
  </line>

  <!-- Title & Subtitle -->
  <text x="450" y="78" text-anchor="middle" class="hero-name">PRASHANT KUMAR</text>
  <text x="450" y="108" text-anchor="middle" class="hero-sub">&lt; DATA SCIENCE • MACHINE LEARNING • GENAI ARCHITECT /&gt;</text>

  <!-- Interactive / Floating Pills -->
  <g transform="translate(180, 185)">
    <rect x="0" y="0" width="150" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="75" y="17" text-anchor="middle" class="badge-text">⚡ 6x Live Repositories</text>
  </g>
  <g transform="translate(345, 185)">
    <rect x="0" y="0" width="165" height="26" rx="13" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
    <text x="82" y="17" text-anchor="middle" class="badge-text" fill="#a78bfa">🤖 Agentic AI &amp; SHAP</text>
  </g>
  <g transform="translate(525, 185)">
    <rect x="0" y="0" width="195" height="26" rx="13" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
    <text x="97" y="17" text-anchor="middle" class="badge-text" fill="#34d399">🏆 5x Industry Simulations</text>
  </g>
</svg>